[project]
name = "es_ppn_id"
authors = [{ name = "Enterprise Systems Australia", email = "support@enterprisesystems.com.au" }]
description = "Indonesian bank import, payment matching, PPN treatment and SPT Masa PPN reporting for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
indent-style = "tab"
